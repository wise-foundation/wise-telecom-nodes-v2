name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install tools dependencies
        run: npm ci --prefix tools

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      # forge 1.7.1 (the current stable) predates solc 0.8.36 and cannot
      # auto-resolve it on a clean machine; see the script header.
      - name: Install solc 0.8.36
        run: bash script/install_solc_0836.sh

      - name: Show Forge version
        run: forge --version

      - name: Run Forge build
        run: forge build --sizes

      - name: Check storage layout alignment
        run: bash script/check_storage_layout.sh

      # The mainnet fork suites replay the live Ethereum and Arbitrum vaults
      # and need MAINNET_RPC_URL / ARBITRUM_RPC_URL (archive access) in .env.
      # CI holds no RPC credentials, so it runs everything else; see the
      # README for running the full suite locally.
      - name: Run Forge tests (offline suites)
        run: forge test -vvv --no-match-path "test/{MoneyForward.t.sol,MoneyForwardViewParity.t.sol,diamond/WiseTelecomNodesBurnWiseFacet.t.sol,diamond/fork/DiamondLiveUsageFork.t.sol,diamond/fork/UniswapV4FlashLoanFork.t.sol,diamond/fork/WiseBurnFork.t.sol,diamond/fork/WiseTelecomNodesPermitFork.t.sol,migration/DiamondMigrationForkE2E.t.sol,migration/PostDeployMigrationFork.t.sol}"
